<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7C548;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  <!-- Crosshair lines -->
  <line x1="100" y1="20" x2="100" y2="70" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="130" x2="100" y2="180" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="20" y1="100" x2="70" y2="100" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="130" y1="100" x2="180" y2="100" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="url(#logoGrad)" filter="url(#glow)"/>
  <!-- K letter -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="url(#logoGrad)" text-anchor="middle" filter="url(#glow)">K</text>
</svg>
